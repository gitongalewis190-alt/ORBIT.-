# Keeps the free Supabase project awake. Supabase pauses free projects after
# about a week without activity. This makes one small request every morning.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       = https://ircuoxjkuszeijribrar.supabase.co
#   SUPABASE_ANON_KEY  = the legacy anon key
name: Keep Orbit awake

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 06:00 Nairobi, every day
  workflow_dispatch:      # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Orbit database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/fields?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat /tmp/body.json
          test "$status" = "200"
